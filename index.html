<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toy Garden</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap" rel="stylesheet">
</head>
<body>

  <h1>Toy Garden</h1>

  <section class="toy-row">

    <div class="toy-item">
      <input type="checkbox" id="dog">

      <label for="dog" class="toy-button">
        <img src="dog.svg" alt="dog toy">
      </label>

      <div class="memory">
        <p>This toy reminds me of childhood afternoons.</p>
      </div>
    </div>

    <div class="toy-item">
      <input type="checkbox" id="car">

      <label for="car" class="toy-button">
        <img src="car.svg" alt="car toy">
      </label>

      <div class="memory">
        <p>I used to push this car across the floor.</p>
      </div>
    </div>

  </section>

</body>
</html>
